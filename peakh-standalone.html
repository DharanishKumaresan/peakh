<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="peakh — a standalone personal record tracker prototype">
  <title>peakh — standalone frontend</title>
  <style>
    /* Standalone redesign handoff: no framework, build step, images, or external assets. */
    :root{--bg:#f5f5f3;--fg:#111;--muted:#74746f;--line:#d4d4ce;--surface:#ebebe7;--orange:#ff4e1f;color-scheme:light}
    :root[data-theme=dark]{--bg:#0a0a0a;--fg:#f5f5f3;--muted:#999993;--line:#30302e;--surface:#191918;color-scheme:dark}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:4px}.mono{font:500 11px/1.45 Consolas,'Courier New',monospace;letter-spacing:.07em;text-transform:uppercase}.num{font-family:'Arial Narrow',Impact,sans-serif;font-stretch:condensed;font-weight:900;letter-spacing:-.04em;line-height:.88;font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.orange{color:var(--orange)}.app{max-width:1540px;margin:auto}.header{height:88px;padding:0 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:50px}.logo{font-size:38px;font-weight:800;letter-spacing:-3px}.logo i{display:inline-block;width:7px;height:7px;background:var(--orange);margin-left:4px}.nav{align-self:stretch;display:flex;gap:34px}.nav button{position:relative;color:var(--muted);font-size:14px}.nav button.active{color:var(--fg)}.nav button.active:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--orange)}.header-spacer{flex:1}.theme{width:40px;height:40px;font-size:18px}.avatar{border:1px solid var(--line);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-size:10px}.main{padding:42px 5% 28px}.hero{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:32px}.hero .kicker{margin:0 0 13px;display:flex;align-items:center;gap:9px}.square{width:6px;height:6px;background:var(--orange);display:inline-block}.hero h1{font-size:clamp(48px,5vw,72px);line-height:.95;letter-spacing:-.055em;margin:0}.hero-date{text-align:right;line-height:1.8}.summary{display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;border-block:1px solid var(--line);padding:21px 0;margin-bottom:35px}.metric{border-right:1px solid var(--line);padding:0 28px;display:flex;align-items:center;gap:15px}.metric:first-child{padding-left:0}.metric:last-child{border:0}.metric .num{font-size:43px}.summary-note{display:flex;align-items:center;justify-content:flex-end;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:38px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;min-height:31px;margin-bottom:18px}.section-head h2{margin:0}.count{border:1px solid var(--line);padding:2px 6px;color:var(--muted)}.filters{display:flex;gap:3px;flex-wrap:wrap}.filters button{padding:7px 11px;color:var(--muted);font-size:11px;border:1px solid transparent}.filters button.active{color:var(--fg);border-color:var(--line);background:var(--surface)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.card{min-width:0;min-height:255px;padding:24px;display:flex;flex-direction:column;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.card:hover{background:var(--surface)}.card-top{display:flex;justify-content:space-between;gap:10px}.card h3{font-size:18px;font-weight:500;margin:0}.category{font-size:9px;margin-top:7px}.value{display:flex;align-items:baseline;gap:9px;margin:30px 0 23px}.value .num{font-size:clamp(59px,5.5vw,83px)}.unit{font-size:10px;color:var(--muted)}.card-bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.change{font-size:9px}.date{font-size:9px;color:var(--muted);margin-top:7px}.spark{width:88px;height:34px}.add-card{align-items:center;justify-content:center;text-align:center;gap:14px}.plus-ring{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:21px}.board-foot{display:flex;justify-content:space-between;color:var(--muted);padding:17px 0;font-size:9px}.sidebar{border-left:1px solid var(--line);padding-left:29px}.side-block{padding-bottom:27px;margin-bottom:27px;border-bottom:1px solid var(--line)}.side-title{display:flex;justify-content:space-between;margin-bottom:22px}.week-total .num{font-size:45px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:17px 0}.day{text-align:center}.day span{display:block;margin-bottom:8px;font-size:8px}.day i{height:27px;background:var(--surface);display:grid;place-items:center;font-style:normal}.day i.on{background:var(--fg);color:var(--bg)}.day i.today{background:var(--orange);color:white}.note{font-size:11px;line-height:1.6;color:var(--muted)}.recent{padding:13px 0;border-bottom:1px solid var(--line)}.recent:last-child{border-bottom:0}.recent-line{display:flex;justify-content:space-between;font-size:12px}.recent-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:8px}.goal-name{margin:0 0 18px;font-size:16px}.goal-pair{display:flex;align-items:baseline;gap:7px}.goal-pair .num{font-size:50px}.goal-pair .target{font-size:26px;color:var(--muted)}.track{height:3px;background:var(--line);margin:15px 0}.track i{display:block;height:100%;background:var(--orange)}.link-btn{padding:0;margin-top:14px;font-size:11px}.fab{position:fixed;right:max(26px,calc((100vw - 1460px)/2));bottom:27px;width:58px;height:58px;border-radius:50%;background:var(--orange);color:white;font-size:28px;z-index:8}.footer{border-top:1px solid var(--line);margin-top:34px;padding:19px 0;color:var(--muted);display:flex;justify-content:space-between;font-size:9px}.back{padding:0;margin-bottom:28px;color:var(--muted);font-size:12px}.detail-title{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.detail-title h1{font-size:48px;letter-spacing:-.045em;margin:0}.primary{background:var(--orange);color:white;padding:13px 18px;font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;border-block:1px solid var(--line);margin:31px 0}.stat{padding:26px 0 30px}.stat+.stat{padding-left:42px;border-left:1px solid var(--line)}.stat .label{display:flex;gap:15px;margin-bottom:18px}.stat .big{display:flex;align-items:baseline;gap:13px}.stat .big .num{font-size:clamp(78px,9vw,140px)}.outline{color:transparent;-webkit-text-stroke:1px var(--muted)}.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:40px}.chart-panel{border-bottom:1px solid var(--line);padding-bottom:28px}.chart{height:270px}.chart svg{width:100%;height:100%;overflow:visible}.chart text{fill:var(--muted);font:10px Consolas,monospace}.heat-wrap{overflow-x:auto}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-template-columns:repeat(26,1fr);gap:4px;min-width:520px}.heat i{aspect-ratio:1;background:var(--surface);border:1px solid var(--line)}.heat i.on{background:var(--fg);border-color:var(--fg)}.heat i.hot{background:var(--orange);border-color:var(--orange)}.history{border-left:1px solid var(--line);padding-left:27px}.history-list{max-height:580px;overflow:auto}.history-row{padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.history-row .right{text-align:right}.history-row strong{font-size:17px}.tabs{display:flex;gap:7px;flex-wrap:wrap;border-block:1px solid var(--line);padding:17px 0;margin:25px 0 35px}.tabs button{border:1px solid var(--line);padding:9px 16px;font-size:12px}.tabs button.active{background:var(--fg);color:var(--bg)}.friends-grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:50px}.rank-row{display:grid;grid-template-columns:45px 1fr auto;align-items:center;gap:18px;border-bottom:1px solid var(--line);padding:21px 0}.rank{font-size:32px}.friend-name{display:flex;align-items:center;gap:14px}.friend-name small{font-size:9px;color:var(--muted)}.initials{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:9px}.rank-value{font-size:43px}.rank-value small{font:10px Consolas,monospace;color:var(--muted);margin-left:7px}.person{padding:18px 0;border-bottom:1px solid var(--line)}.person-head{display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:14px}.person-records{display:flex;gap:17px;flex-wrap:wrap}.person-records span{display:block;color:var(--muted);font-size:8px;margin-bottom:5px}.empty{border:1px solid var(--line);padding:42px 20px;text-align:center;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:20}.modal-backdrop[hidden]{display:none}.modal{width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--bg);border:1px solid var(--line);padding:30px;position:relative}.close{position:absolute;right:18px;top:16px;font-size:22px}.modal h2{font-size:29px;letter-spacing:-.04em;margin:9px 0}.modal-copy{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 20px}.modal form{display:grid;gap:17px}.field{display:grid;gap:8px;font:10px Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);padding:12px;min-height:46px;font-family:Arial,sans-serif;font-size:16px;border-radius:0}.modal-tabs{display:flex;border-bottom:1px solid var(--line)}.modal-tabs button{padding:10px 12px;color:var(--muted)}.modal-tabs button.active{color:var(--fg);border-bottom:2px solid var(--orange)}.modal-error{color:var(--orange);font-size:12px;line-height:1.5;margin:0}.submit{width:100%;min-height:48px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:13px 20px;font-size:12px;z-index:30}.toast[hidden]{display:none}.screen{min-height:500px}
    @media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:minmax(0,1fr) 225px}.header .tagline{display:none}.detail-grid{grid-template-columns:minmax(0,1fr) 250px}}
    @media(max-width:760px){.header{height:74px;padding:0 6%;gap:20px}.logo{font-size:34px}.nav{gap:20px}.nav button{font-size:12px}.avatar{display:none}.main{padding:28px 6% 90px}.hero{align-items:flex-start;flex-direction:column;gap:20px;padding-bottom:25px}.hero h1{font-size:43px}.hero-date{display:none}.summary{grid-template-columns:repeat(3,1fr);padding:17px 0;margin-bottom:26px}.metric{display:block;padding:0 13px}.metric .num{font-size:35px}.metric .mono{display:block;font-size:8px;margin-top:5px}.summary-note{display:none}.layout{display:block}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:18px 15px;min-height:218px}.card h3{font-size:15px}.value{margin:24px 0 21px}.value .num{font-size:58px}.spark{width:55px}.sidebar{border:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:28px}.goal-side{display:none}.detail-title h1{font-size:37px}.stats{margin:26px 0}.stat{padding:22px 0}.stat+.stat{padding-left:20px}.stat .big .num{font-size:65px}.detail-grid,.friends-grid{display:block}.history{border:0;padding:0;margin-top:32px}.friends-grid aside{margin-top:35px}.rank-row{grid-template-columns:32px 1fr auto;gap:10px}.rank-value{font-size:34px}.fab{right:22px;bottom:22px}.footer{display:none}.board-foot{font-size:8px}.modal{padding:26px}}
    @media(max-width:390px){.card{padding:16px 11px}.value .num{font-size:50px}.nav{gap:13px}.section-head{align-items:flex-start}.filters button{padding:5px;font-size:9px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="header"><button class="logo" data-go="home" aria-label="peakh home">peakh<i></i></button><nav class="nav"><button data-go="home" class="active">My records</button><button data-go="friends">Friends</button></nav><span class="header-spacer"></span><span class="tagline mono muted">A little better, every day.</span><button id="theme" class="theme" aria-label="Toggle theme">◐</button><span class="avatar">YOU</span></header>
    <main class="main"><div id="screen" class="screen"></div><footer class="footer mono"><span>peakh / built on effort.</span><span>Standalone redesign prototype · data stays in this browser</span></footer></main>
    <button id="fab" class="fab" aria-label="Log a new effort">+</button>
  </div>
  <div id="modalBackdrop" class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="close" id="closeModal" aria-label="Close">×</button><p class="mono orange">peakh / make your mark</p><h2 id="modalTitle"></h2><p class="modal-copy" id="modalCopy"></p><div id="modalBody"></div></section></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
  (()=>{
    'use strict';
    const KEY='peakh-standalone-data-v1', THEME='peakh-standalone-theme';
    const state={view:'home',selected:null,filter:'All',range:'All',board:'run',modal:null};
    const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const today=()=>iso(new Date()), dayAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
    const shortDate=s=>new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    const fmt=(n,u)=>u==='min:sec'?`${Math.floor(n/60)}:${String(Math.round(n%60)).padStart(2,'0')}`:Number(n.toFixed(2)).toString();
    const parse=(s,u)=>u==='min:sec'?(/^\d+:([0-5]\d)$/.test(s)?s.split(':').map(Number).reduce((m,v)=>m*60+v):NaN):Number(s);
    const best=a=>a.entries.length?(a.lower?Math.min(...a.entries.map(e=>e.value)):Math.max(...a.entries.map(e=>e.value))):0;
    const byDate=(a,b)=>a.date.localeCompare(b.date);
    const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
    function seed(){const defs=[['run','Running','5 KM · TIME','min:sec',true,1200,[1560,1532,1490,1505,1450,1438,1394,1380,1356,1344]],['bench','Bench press','STRENGTH · 1 REP MAX','kg',false,100,[60,65,65,70,67.5,75,77.5,80,82.5,85]],['swim','Swimming','100 M · FREESTYLE','min:sec',true,90,[132,125,128,120,118,115,112,110,107,102]],['push','Pushups','BODYWEIGHT · UNBROKEN','reps',false,60,[25,28,30,28,34,36,38,40,42,45]],['pull','Pullups','BODYWEIGHT · UNBROKEN','reps',false,20,[5,6,7,7,8,9,10,10,11,12]]];return{sample:true,activities:defs.map(([id,name,category,unit,lower,goal,values],ix)=>({id,name,category,unit,lower,goal,entries:values.map((value,j)=>({id:`sample-${ix}-${j}`,date:dayAgo((9-j)*7+[0,1,3,2,4][ix]),value}))})),friends:[{id:'alex',name:'Alex Morgan',records:{run:1290,bench:95,swim:99,push:52,pull:16}},{id:'sam',name:'Sam Chen',records:{run:1422,bench:80,swim:95,push:40,pull:10}},{id:'jordan',name:'Jordan Lee',records:{run:1388,bench:90,swim:110,push:48,pull:14}}]}}
    let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch{data=seed()}
    function save(message){localStorage.setItem(KEY,JSON.stringify(data));render();closeModal();toast(message)}
    function toast(message){const el=$('#toast');el.textContent=message;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2800)}
    function delta(v,u){return`${v>0?'+':v<0?'−':''}${fmt(Math.abs(v),u)}${u==='min:sec'?'':' '+u}`}
    function initials(n){return n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
    function spark(a){const v=[...a.entries].sort(byDate).map(e=>e.value);if(v.length<2)return'';const lo=Math.min(...v),hi=Math.max(...v),p=v.map((x,i)=>[i/(v.length-1)*86,28-(x-lo)/(hi-lo||1)*23]);const bi=v.indexOf(best(a));return`<svg class="spark" viewBox="0 0 90 32" aria-hidden="true"><polyline points="${p.map(x=>x.join(',')).join(' ')}" fill="none" stroke="var(--fg)" stroke-width="1.3"/><circle cx="${p[bi][0]}" cy="${p[bi][1]}" r="2.7" fill="var(--orange)"/></svg>`}
    function chart(a,entries){if(!entries.length)return'<div class="empty">Log your first effort to start your progress chart.</div>';const W=800,H=250,P=35,vals=entries.map(e=>e.value),lo=Math.min(...vals),hi=Math.max(...vals),span=hi-lo||1,pts=entries.map((e,i)=>({x:P+i/(Math.max(1,entries.length-1))*(W-P*2),y:H-P-(e.value-lo)/span*(H-P*2),e}));const ticks=[0,.25,.5,.75,1];return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart for ${esc(a.name)}">${ticks.map(t=>`<line x1="${P}" y1="${P+t*(H-P*2)}" x2="${W-P}" y2="${P+t*(H-P*2)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="0" y="${P+t*(H-P*2)+4}">${esc(fmt(hi-t*span,a.unit))}</text>`).join('')}<polyline points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="var(--fg)" stroke-width="2"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="${p.e.value===best(a)?6:3}" fill="${p.e.value===best(a)?'var(--orange)':'var(--fg)'}"><title>${shortDate(p.e.date)} · ${fmt(p.e.value,a.unit)}</title></circle>`).join('')}<text x="${P}" y="${H-5}">${shortDate(entries[0].date)}</text><text text-anchor="end" x="${W-P}" y="${H-5}">${shortDate(entries.at(-1).date)}</text></svg></div>`}
    function heat(a){const days=Array.from({length:182},(_,i)=>dayAgo(181-i)),counts={};a.entries.forEach(e=>counts[e.date]=(counts[e.date]||0)+1);return`<section style="margin-top:28px"><div class="section-head"><h2 class="mono">Consistency</h2><span class="mono muted">Last 26 weeks</span></div><div class="heat-wrap"><div class="heat">${days.map(d=>`<i class="${counts[d]>1?'hot':counts[d]?'on':''}" title="${shortDate(d)} · ${counts[d]||0} logs"></i>`).join('')}</div></div><p class="mono muted">${days.filter(d=>counts[d]).length} active days</p></section>`}
    function card(a,i){const sorted=[...a.entries].sort(byDate),pr=best(a),prev=sorted.length>1?best({...a,entries:sorted.slice(0,-1)}):0,diff=pr-prev,last=[...sorted].reverse().find(e=>e.value===pr);return`<button class="card" data-activity="${esc(a.id)}"><div class="card-top"><h3>${esc(a.name)}</h3><span>↗</span></div><div class="category mono muted">${esc(a.category)}</div><div class="value"><span class="num ${i===0?'orange':''}">${a.entries.length?fmt(pr,a.unit):'—'}</span><span class="unit mono">${esc(a.unit)}</span></div><div class="card-bottom"><div><div class="change mono">${sorted.length>1?delta(diff,a.unit)+' from previous PR':'Your starting line'}</div><div class="date mono">${last?shortDate(last.date)+' · PERSONAL BEST':'LOG YOUR FIRST SESSION'}</div></div>${spark(a)}</div></button>`}
    function home(){const entries=data.activities.flatMap(a=>a.entries.map(e=>({...e,activity:a}))).sort(byDate).reverse(),days=new Set(entries.map(e=>e.date)),week=Array.from({length:7},(_,i)=>dayAgo(i)).filter(d=>days.has(d)).length,shown=data.activities.filter(a=>state.filter==='All'||(state.filter==='Strength'?!a.lower:a.lower)),featured=data.activities.find(a=>a.id==='bench')||data.activities[0];let monthly=0;data.activities.forEach(a=>{let b=a.lower?Infinity:0;[...a.entries].sort(byDate).forEach(e=>{const pr=a.lower?e.value<b:e.value>b;b=a.lower?Math.min(b,e.value):Math.max(b,e.value);if(pr&&e.date>=dayAgo(30))monthly++})});return`<section class="hero"><div><p class="kicker mono muted"><i class="square"></i>Your performance, on record.</p><h1>Your personal best<span class="orange">.</span></h1></div><div class="hero-date mono muted">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'short',year:'numeric'})}<br>The work adds up.</div></section><section class="summary"><div class="metric"><span class="num">${String(data.activities.length).padStart(2,'0')}</span><span class="mono muted">Activities<br>tracked</span></div><div class="metric"><span class="num">${String(entries.length).padStart(2,'0')}</span><span class="mono muted">Sessions<br>logged</span></div><div class="metric"><span class="num orange">${String(monthly).padStart(2,'0')}</span><span class="mono muted">New PRs<br>Last 30 days</span></div><div class="summary-note">↗ &nbsp; Progress is personal.</div></section><div class="layout"><section><div class="section-head"><h2 class="mono">The record board <span class="count">${String(shown.length).padStart(2,'0')}</span></h2><div class="filters">${['All','Strength','Endurance'].map(x=>`<button data-filter="${x}" class="${state.filter===x?'active':''}">${x}</button>`).join('')}</div></div><div class="cards">${shown.map(card).join('')}<button class="card add-card" data-open="create"><span class="plus-ring">+</span><span class="mono">Add an activity</span><span class="muted">Make it your own.</span></button></div><div class="board-foot mono"><span>Every effort has a place here.</span><span>Click a record to explore ↗</span></div></section><aside class="sidebar"><section class="side-block"><div class="side-title mono"><span>This week</span><span class="muted">Last 7 days</span></div><div class="week-total"><span class="num">${week}</span><span class="mono muted"> / 7 days active</span></div><div class="week">${Array.from({length:7},(_,i)=>{const d=dayAgo(6-i);return`<div class="day"><span class="mono">${new Date(d+'T12:00:00').toLocaleDateString('en',{weekday:'short'})[0]}</span><i class="${days.has(d)?'on':''} ${i===6?'today':''}">${days.has(d)?'✓':i===6?'·':''}</i></div>`}).join('')}</div><p class="note">${week?'One session at a time. It all counts.':'Your next session starts a new streak.'}</p></section><section class="side-block"><div class="side-title mono"><span>Latest efforts</span><span class="muted">${String(Math.min(3,entries.length)).padStart(2,'0')}</span></div>${entries.slice(0,3).map(e=>`<div class="recent"><div class="recent-line"><span>${esc(e.activity.name)}</span><span>${fmt(e.value,e.activity.unit)} ${e.activity.unit==='min:sec'?'':esc(e.activity.unit)}</span></div><div class="recent-meta mono muted"><span>${shortDate(e.date)}</span>${e.value===best(e.activity)?'<b class="orange">Personal best ↗</b>':''}</div></div>`).join('')}</section>${featured?`<section class="goal-side"><div class="side-title mono"><span>The next milestone</span><span class="orange">↗</span></div><h3 class="goal-name">${esc(featured.name)}</h3><div class="goal-pair"><span class="num">${best(featured)||'—'}</span><span class="num target">/ ${featured.goal||'—'}</span><span class="mono muted">${esc(featured.unit)}</span></div><div class="track"><i style="width:${Math.min(100,featured.goal?best(featured)/featured.goal*100:0)}%"></i></div><button class="link-btn" data-activity="${esc(featured.id)}">View progress →</button></section>`:''}</aside></div>`}
    function detail(a){let entries=[...a.entries].sort(byDate);if(state.range!=='All')entries=entries.filter(e=>e.date>=dayAgo(state.range==='30D'?30:90));const history=[...a.entries].sort(byDate).map((e,i,all)=>({e,change:i?e.value-all[i-1].value:null})).reverse(),pr=best(a),prEntry=[...a.entries].sort(byDate).reverse().find(e=>e.value===pr);return`<button class="back" data-go="home">← All records</button><div class="detail-title"><div><h1>${esc(a.name)}<span class="orange">.</span></h1><p class="mono muted">${esc(a.category)}</p></div><button class="primary" data-open="log" data-id="${esc(a.id)}">+ &nbsp; Log effort</button></div><div class="stats"><section class="stat"><div class="label mono muted"><i class="square"></i>Personal record</div><div class="big"><span class="num orange">${a.entries.length?fmt(pr,a.unit):'—'}</span><span class="mono muted">${esc(a.unit)}</span></div><p class="mono muted">${prEntry?'Set on '+shortDate(prEntry.date):'Your first effort starts here'}</p></section><section class="stat"><div class="label mono muted">The next milestone <button data-open="goal" data-id="${esc(a.id)}"><u>Edit goal ↗</u></button></div><div class="big"><span class="num outline">${a.goal?fmt(a.goal,a.unit):'—'}</span><span class="mono muted">${esc(a.unit)}</span></div><p class="mono muted">${a.goal&&a.entries.length?fmt(Math.abs(a.goal-pr),a.unit)+' to go':'Give your progress a direction'}</p></section></div><div class="detail-grid"><div><section class="chart-panel"><div class="section-head"><h2 class="mono">Progress over time</h2><div class="filters">${['30D','90D','All'].map(x=>`<button data-range="${x}" class="${state.range===x?'active':''}">${x}</button>`).join('')}</div></div>${chart(a,entries)}<p class="mono muted">● Logged effort <span class="orange">&nbsp; ● Personal best</span><span style="float:right">${a.lower?'Lower':'Higher'} is better</span></p></section>${heat(a)}</div><aside class="history"><div class="section-head"><h2 class="mono">Log history</h2><span class="count mono">${a.entries.length}</span></div><div class="history-list">${history.map(({e,change})=>`<div class="history-row"><div><div class="mono muted">${shortDate(e.date)} ${e.date.slice(0,4)}</div><div class="mono muted" style="font-size:8px;margin-top:8px">${e.value===pr?'Personal best':'Logged effort'}</div></div><div class="right"><strong>${fmt(e.value,a.unit)} <small>${esc(a.unit)}</small></strong><div class="mono ${change!==null&&(a.lower?change<0:change>0)?'orange':'muted'}" style="font-size:9px;margin-top:7px">${change===null?'First entry':delta(change,a.unit)}</div></div></div>`).join('')||'<p class="note">A clean slate. Make your first mark.</p>'}</div></aside></div>`}
    function friends(){const a=data.activities.find(x=>x.id===state.board)||data.activities[0],ranked=[...data.friends.filter(f=>f.records[a.id]!=null).map(f=>({name:f.name,value:f.records[a.id],you:false})),...(a.entries.length?[{name:'You',value:best(a),you:true}]:[])].sort((x,y)=>a.lower?x.value-y.value:y.value-x.value);return`<section class="hero"><div><p class="kicker mono muted"><i class="square"></i>Better, together.</p><h1>A little competition<span class="orange">.</span></h1></div><button class="primary" data-open="friend">+ &nbsp; Add friend’s PR</button></section><div class="tabs">${data.activities.map(x=>`<button data-board="${esc(x.id)}" class="${x.id===a.id?'active':''}">${esc(x.name)}</button>`).join('')}</div><div class="friends-grid"><section><div class="section-head"><h2 class="mono">${esc(a.name)} leaderboard</h2><span class="mono muted">${a.lower?'Fastest':'Strongest'} first</span></div>${ranked.map((r,i)=>`<div class="rank-row"><span class="rank num ${i===0?'orange':''}">${String(i+1).padStart(2,'0')}</span><span class="friend-name"><i class="initials">${initials(r.name)}</i>${esc(r.name)} ${r.you?'<small>YOUR PR</small>':''}</span><span class="rank-value num">${fmt(r.value,a.unit)}<small>${esc(a.unit)}</small></span></div>`).join('')||'<div class="empty">No records yet. Set the first one.</div>'}<p class="note">A shared benchmark. Your own pace.</p></section><aside><div class="section-head"><h2 class="mono">Your circle <span class="count">${data.friends.length}</span></h2></div>${data.friends.map(f=>`<div class="person"><div class="person-head"><i class="initials">${initials(f.name)}</i>${esc(f.name)}</div><div class="person-records">${data.activities.filter(x=>f.records[x.id]!=null).map(x=>`<div><span class="mono">${esc(x.name)}</span>${fmt(f.records[x.id],x.unit)} <small class="muted">${esc(x.unit)}</small></div>`).join('')}</div></div>`).join('')}<p class="note">Friend records are entered locally. Add the same name again to update or add another activity.</p></aside></div>`}
    function render(){document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',(state.view==='friends')===!!i));const active=data.activities.find(a=>a.id===state.selected);$('#screen').innerHTML=state.view==='friends'?friends():active?detail(active):home();bind()}
    function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.view=b.dataset.go==='friends'?'friends':'home';state.selected=null;render();scrollTo(0,0)});document.querySelectorAll('[data-activity]').forEach(b=>b.onclick=()=>{state.view='home';state.selected=b.dataset.activity;state.range='All';render();scrollTo(0,0)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{state.range=b.dataset.range;render()});document.querySelectorAll('[data-board]').forEach(b=>b.onclick=()=>{state.board=b.dataset.board;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open,b.dataset.id))}
    function openModal(kind,id){state.modal=kind;const a=data.activities.find(x=>x.id===(id||state.selected))||data.activities[0],titles={log:'Put in the work.',create:'A new pursuit.',goal:'Aim a little higher.',friend:'Raise the benchmark.'},copies={log:'One effort. One step forward.',create:'Give your activity a name and a way to measure it.',goal:'Set a target worth working toward.',friend:'Add a friend and their record for a shared activity.'};$('#modalTitle').textContent=titles[kind];$('#modalCopy').textContent=copies[kind];$('#modalBody').innerHTML=form(kind,a);$('#modalBackdrop').hidden=false;$('#modalBody form').onsubmit=submit;$('#modalBody [autofocus]')?.focus();document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>openModal(b.dataset.switch,a.id))}
    const activityOptions=selected=>data.activities.map(a=>`<option value="${esc(a.id)}" ${a.id===selected?'selected':''}>${esc(a.name)} · ${esc(a.unit)}</option>`).join('');
    function form(k,a){if(k==='create')return`<form><div class="modal-tabs"><button type="button" data-switch="log">Log effort</button><button type="button" class="active">New activity</button></div><label class="field">Activity name<input name="name" maxlength="45" placeholder="e.g. Deadlift" required autofocus></label><label class="field">Measurement<select name="unit">${['reps','kg','lb','min:sec','sec','km','m'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">A better record means<select name="lower"><option value="false">A higher number</option><option value="true">A lower number</option></select></label><p class="modal-error"></p><button class="primary submit">Create activity →</button></form>`;if(k==='friend')return`<form><label class="field">Friend’s name<input name="name" maxlength="50" required autofocus></label><label class="field">Activity<select name="activity">${activityOptions(a.id)}</select></label><label class="field">Their record<input name="value" required placeholder="${a.unit==='min:sec'?'22:30':'0'}"></label><p class="modal-error"></p><button class="primary submit">Save friend’s PR →</button></form>`;return`<form>${k==='log'?`<div class="modal-tabs"><button type="button" class="active">Log effort</button><button type="button" data-switch="create">New activity</button></div><label class="field">Activity<select name="activity">${activityOptions(a.id)}</select></label>`:''}<label class="field">${k==='goal'?'Goal':'Your effort'} · ${esc(a.unit)}<input name="value" required autofocus placeholder="${a.unit==='min:sec'?'22:30':'0'}" value="${k==='goal'&&a.goal?fmt(a.goal,a.unit):''}"></label>${k==='log'?`<label class="field">Date<input name="date" type="date" max="${today()}" value="${today()}" required></label>`:''}<p class="modal-error"></p><button class="primary submit">${k==='goal'?'Set goal':'Log effort'} →</button></form>`}
    function submit(e){e.preventDefault();const f=new FormData(e.target),fail=m=>e.target.querySelector('.modal-error').textContent=m;if(state.modal==='create'){const name=String(f.get('name')).trim();if(data.activities.some(a=>a.name.toLowerCase()===name.toLowerCase()))return fail('That activity already exists.');const a={id:uid(),name,category:`CUSTOM · ${f.get('lower')==='true'?'LOWER':'HIGHER'} IS BETTER`,unit:String(f.get('unit')),lower:f.get('lower')==='true',goal:0,entries:[]};data.activities.push(a);save('Activity added. Ready for your first log.');openModal('log',a.id);return}const id=String(f.get('activity')||state.selected),a=data.activities.find(x=>x.id===id);if(!a)return fail('Choose an activity.');const val=parse(String(f.get('value')),a.unit);if(!Number.isFinite(val)||val<=0)return fail(a.unit==='min:sec'?'Use minutes:seconds, for example 22:30.':'Enter a positive value.');if(state.modal==='goal'){a.goal=val;save('Your next target is set.');return}if(state.modal==='friend'){const name=String(f.get('name')).trim();if(!name)return fail('Enter a friend’s name.');let p=data.friends.find(x=>x.name.toLowerCase()===name.toLowerCase());if(p)p.records[id]=val;else data.friends.push({id:uid(),name,records:{[id]:val}});save('Friend’s record saved.');return}const date=String(f.get('date'));if(!date||date>today())return fail('Choose today or an earlier date.');const isPR=!a.entries.length||(a.lower?val<best(a):val>best(a));a.entries.push({id:uid(),date,value:val});save(isPR?'A new personal best. Well earned.':'Session logged. Keep showing up.')}
    function closeModal(){state.modal=null;$('#modalBackdrop').hidden=true}$('#closeModal').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('#fab').onclick=()=>openModal('log',state.selected||data.activities[0]?.id);$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem(THEME,t)};document.documentElement.dataset.theme=localStorage.getItem(THEME)||'light';document.querySelectorAll('.header [data-go]').forEach(b=>b.onclick=()=>{state.view=b.dataset.go==='friends'?'friends':'home';state.selected=null;render()});render();
  })();
  </script>
